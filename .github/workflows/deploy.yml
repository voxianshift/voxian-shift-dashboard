name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # Workload Identity Federation (no stored keys)

env:
  REGION: asia-southeast1
  REGISTRY: asia-southeast1-docker.pkg.dev/voxian-shift-app/voxian
  WIF_PROVIDER: projects/184581024855/locations/global/workloadIdentityPools/github/providers/github
  DEPLOYER: voxian-deployer@voxian-shift-app.iam.gserviceaccount.com
  # Baked into the web build as the /api/* proxy target (ignored by the API image)
  API_BASE_URL: https://voxian-api-184581024855.asia-southeast1.run.app

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # format, lint, typecheck, tests, builds
      - run: pnpm exec vp run ready

  deploy:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet
      - name: Build and push image
        run: |
          docker build -f apps/${{ matrix.app }}/Dockerfile --build-arg API_BASE_URL=$API_BASE_URL -t $REGISTRY/${{ matrix.app }}:${{ github.sha }} .
          docker push $REGISTRY/${{ matrix.app }}:${{ github.sha }}
      - name: Deploy to Cloud Run
        run: gcloud run deploy voxian-${{ matrix.app }} --image $REGISTRY/${{ matrix.app }}:${{ github.sha }} --region $REGION --quiet
