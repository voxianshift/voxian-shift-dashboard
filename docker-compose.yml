# Local Postgres for development. Matches Cloud SQL voxian-db (POSTGRES_18).
# API connects directly through DATABASE_URL. Existing PostgreSQL 18 volume is preserved.
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: voxian
    ports:
      - "5433:5432" # host 5433: 5432 is often taken by other local Postgres
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voxian"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
