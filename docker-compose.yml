# Local Postgres for development. Matches Cloud SQL voxian-db (POSTGRES_18).
# Used by the SQL Connect emulator (pnpm emulators) and by apps/api via DATABASE_URL.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: voxian
    ports:
      - "5433:5432" # host 5433: 5432 is often taken by other local Postgres
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voxian"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
