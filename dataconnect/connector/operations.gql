# Every operation is scoped to the signed-in user's UID

mutation UpsertMe($displayName: String, $email: String) @auth(level: USER) {
  user_upsert(data: { id_expr: "auth.uid", displayName: $displayName, email: $email })
}

query Me @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    displayName
    email
    assessments_on_user(orderBy: { createdAt: DESC }, limit: 1) {
      id
      roleId
      taskGravity
      superpower
      posture
      pacing
      northStar
      exposureScore
      createdAt
    }
  }
}

mutation CreateAssessment(
  $roleId: String!
  $taskGravity: String!
  $superpower: String!
  $posture: String!
  $pacing: String!
  $northStar: String
) @auth(level: USER) {
  assessment_insert(
    data: {
      userId_expr: "auth.uid"
      roleId: $roleId
      taskGravity: $taskGravity
      superpower: $superpower
      posture: $posture
      pacing: $pacing
      northStar: $northStar
    }
  )
}
